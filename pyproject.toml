[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lite-pi"
version = "0.1.0"
description = "A small, inspectable coding agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.5,<5",
    "jsonschema>=4.23,<5",
    "markdown-it-py==4.0.0",
    "mcp==1.30.0",
    "playwright==1.64.0",
    "prompt-toolkit==3.0.52",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "wcwidth==0.9.2",
]

[project.scripts]
lite-pi = "lite_pi.__main__:main"

[project.optional-dependencies]
embeddings = ["onnxruntime==1.23.2", "tokenizers==0.22.2", "numpy==2.2.6"]

[dependency-groups]
compare = [
    "langgraph==1.0.10",
]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12.20260906",
    "pyte>=0.8,<0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lite_pi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/baselines",
    "/README.md",
    "/ARCHITECTURE.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.env.example",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "C90"]
allowed-confusables = ["，", "；", "：", "（", "）", "–", "×", "›"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "RUF", "C90"]
"scripts/**" = ["B", "SIM", "RUF", "C90"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lite_pi", "tests/compare"]
mypy_path = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "anyio", "anyio.*", "playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["compare.*"]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
